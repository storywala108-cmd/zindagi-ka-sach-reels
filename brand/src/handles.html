<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Poppins; src: url(../../fonts/Poppins-Black.ttf); }
html, body { margin: 0; background: transparent; }
/* the strip that sits at the bottom of every reel picture and cover: brand logo + handle, white with a dark edge */
.strip { width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; }
.row { display: flex; gap: 26px; }
.h { display: flex; align-items: center; gap: 9px; font: 26px Poppins; color: #fff;
  text-shadow: 0 0 2px #000, 0 0 2px #000, 0 1px 3px rgba(0,0,0,.8); }
.ic { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.ic svg { width: 19px; height: 19px; fill: #fff; }
.fb { background: #0866FF; } .yt { background: #FF0000; }
.ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
</style></head>
<body>
<div class="strip">
  <div class="row">
    <div class="h"><span class="ic fb">FB_SVG</span>zindagikasach.kahani</div>
    <div class="h"><span class="ic yt">YT_SVG</span>@zindagikasach.kahani</div>
  </div>
  <div class="row"><div class="h"><span class="ic ig">IG_SVG</span>@zindagi_ka_sach8</div></div>
</div>
</body></html>
