name: Zindagi Ka Sach Reels

on:
  schedule:
    # GitHub cron is UTC and usually starts 30-60 min late: 02:45 + 11:45 UTC (8:15 AM + 5:15 PM IST) lands ~9 AM + ~6 PM IST
    - cron: '45 2,11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: make the reel but do not post'
        type: boolean
        default: false
      topic:
        description: 'Story idea for this run only (empty = Gemini picks a fresh one)'
        type: string
        default: ''
      youtube:
        description: 'Also upload this run to YouTube (outside the 6 PM slot)'
        type: boolean
        default: false

concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel:
    # pause switch: repository variable AUTO_POST=off stops scheduled runs; hand-started runs always go
    if: github.event_name != 'schedule' || vars.AUTO_POST != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Ubuntu's own FFmpeg is too old (needs libass/harfbuzz 7+); same static build as Infax
      - name: Install FFmpeg 9.0 (static)
        run: |
          curl -fsSL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"

      # word timings (faster-whisper small) + Kokoro fallback voice
      - name: Voice tools
        run: pip install -q faster-whisper kokoro-onnx soundfile

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            models
          key: zks-models-v1

      - name: Kokoro model (fallback voice)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.int8.onnx ] || curl -fsSL -o models/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f models/voices-v1.0.bin ] || curl -fsSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      # all keys and settings live in one repository secret (the laptop's .env); never printed
      - name: Write settings
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DRY: ${{ inputs.dry_run }}
        run: |
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          if [ "$DRY" = "true" ]; then sed -i 's/^POST_ENABLED=.*/POST_ENABLED=false/' .env; fi
          mkdir -p temp output logs

      - name: Make and post the reel
        env:
          REEL_ROOT: ${{ github.workspace }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_YT: ${{ inputs.youtube }}
          PYTHON: python
        run: node scripts/zks.js all "${{ inputs.topic }}"

      - name: Keep the reel for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/*.mp4
            output/*.txt
            logs/reel.log

      # used topics + post log carry over to the next run (never .env, never reel.log)
      - name: Remember state
        if: always()
        run: |
          rm -f .env
          git config user.name "zks-reel-bot"
          git config user.email "zks-reel-bot@users.noreply.github.com"
          git add logs/used-topics.txt logs/posts.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "reel state ${{ github.run_number }}" && git pull -q --rebase && git push -q)
